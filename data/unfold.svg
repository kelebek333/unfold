<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0cf96"/><stop offset="1" stop-color="#e0b878"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4a05c"/><stop offset="1" stop-color="#bd8745"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b37f3f"/><stop offset="1" stop-color="#96672d"/></linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb2f2"/><stop offset="1" stop-color="#3f86d6"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <ellipse cx="64" cy="117" rx="48" ry="6" fill="#000" opacity="0.28" filter="url(#shadow)"/>

  <!-- the box -->
  <polygon points="16,40 64,62 64,112 16,90" fill="url(#left)"/>
  <polygon points="64,62 112,40 112,90 64,112" fill="url(#right)"/>
  <polygon points="64,18 112,40 64,62 16,40" fill="url(#top)"/>
  <g fill="none" stroke="#7a521f" stroke-opacity="0.55" stroke-width="1.4" stroke-linejoin="round">
    <polygon points="64,18 112,40 112,90 64,112 16,90 16,40"/>
    <polyline points="16,40 64,62 112,40"/>
    <line x1="64" y1="62" x2="64" y2="112"/>
  </g>

  <!-- the tape: across the top, then down the side -->
  <polygon points="34.2,31.6 45.8,26.4 93.8,48.4 82.2,53.6" fill="url(#tape)"/>
  <polygon points="82.2,53.6 93.8,48.4 93.8,98.4 82.2,103.6" fill="#3a79c4"/>
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"><line x1="38" y1="30" x2="85" y2="51.2"/></g>

  <!-- a label -->
  <polygon points="24,60 54,73.5 54,92 24,78.5" fill="#fbfbf6" opacity="0.95"/>
  <g stroke="#8a7a60" stroke-width="2" stroke-linecap="round"><line x1="29" y1="66.5" x2="44" y2="73.3"/><line x1="29" y1="72.5" x2="49" y2="81.5"/><line x1="29" y1="78" x2="40" y2="83"/></g>
</svg>
